name: Build Production Dist

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install --legacy-peer-deps

      - name: Build dist
        run: npm run build

      - name: Upload dist artifact
        uses: actions/upload-artifact@v4
        with:
          name: dist-build
          path: dist/
          include-hidden-files: true

      - name: Check FTP deployment secrets
        id: ftp_check
        env:
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
          FTP_SERVER_DIR: ${{ secrets.FTP_SERVER_DIR }}
        run: |
          echo "FTP_SERVER present: $([ -n "$FTP_SERVER" ] && echo yes || echo no)"
          echo "FTP_USERNAME present: $([ -n "$FTP_USERNAME" ] && echo yes || echo no)"
          echo "FTP_PASSWORD present: $([ -n "$FTP_PASSWORD" ] && echo yes || echo no)"
          DIR="${FTP_SERVER_DIR:-./}"
          case "$DIR" in
            */) ;;
            *) DIR="${DIR}/" ;;
          esac
          echo "server_dir=${DIR}" >> "$GITHUB_OUTPUT"
          if [ -n "$FTP_SERVER" ] && [ -n "$FTP_USERNAME" ] && [ -n "$FTP_PASSWORD" ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Deploy dist to HostPinnacle cPanel via FTP
        if: steps.ftp_check.outputs.ready == 'true'
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ftps
          security: loose
          timeout: 180000
          local-dir: ./dist/
          server-dir: ${{ steps.ftp_check.outputs.server_dir }}
          exclude: |
            **/.git*
            **/.git*/**
            **/node_modules/**
            assets/aistudio/**
            api/config.php
